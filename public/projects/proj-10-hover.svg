<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="#131424" />
  <g transform="translate(150, 150)">
    <text x="0" y="60" font-family="monospace" font-size="44" font-weight="900" fill="#C6C8F5">TOKEN GRAPH v4.0</text>
    <rect x="0" y="100" width="700" height="4" fill="#3B3F6E" />
    
    <!-- Color Swatches -->
    <rect x="0" y="150" width="120" height="120" rx="16" fill="#EF4444" />
    <text x="60" y="300" text-anchor="middle" font-family="monospace" font-size="18" fill="#C6C8F5">RED 500</text>
    
    <rect x="180" y="150" width="120" height="120" rx="16" fill="#3B82F6" />
    <text x="240" y="300" text-anchor="middle" font-family="monospace" font-size="18" fill="#C6C8F5">BLUE 500</text>
    
    <rect x="360" y="150" width="120" height="120" rx="16" fill="#22C55E" />
    <text x="420" y="300" text-anchor="middle" font-family="monospace" font-size="18" fill="#C6C8F5">GREEN 500</text>
    
    <rect x="540" y="150" width="120" height="120" rx="16" fill="#c0fe04" />
    <text x="600" y="300" text-anchor="middle" font-family="monospace" font-size="18" fill="#c0fe04">NEON LIME</text>

    <!-- Typography scale -->
    <g fill="#FFFFFF" font-family="monospace" font-weight="bold">
      <text x="0" y="440" font-size="48">Display / 48px</text>
      <text x="0" y="520" font-size="32">Heading / 32px</text>
      <text x="0" y="580" font-size="20" fill="#94A3B8">Body / 20px / 1.5 line-height</text>
    </g>
  </g>
  <text x="500" y="880" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#c0fe04">CROSS-PLATFORM DESIGN SYSTEM ↗</text>
</svg>