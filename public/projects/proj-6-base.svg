<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <rect width="900" height="1200" fill="#ECE9F4" />
  <g transform="translate(200, 200)">
    <!-- Phone body -->
    <rect x="0" y="0" width="500" height="1000" rx="60" fill="#0D0E11" stroke="#222" stroke-width="12" />
    <!-- Dynamic island -->
    <rect x="180" y="30" width="140" height="34" rx="17" fill="#000000" />
    <!-- Status bar -->
    <text x="50" y="55" font-family="monospace" font-size="20" font-weight="bold" fill="#FFFFFF">9:41</text>
    <text x="450" y="55" text-anchor="end" font-family="monospace" font-size="18" font-weight="bold" fill="#FFFFFF">5G 100%</text>

    <!-- App grid -->
    <g transform="translate(70, 160)">
      <!-- Adrive -->
      <rect x="0" y="0" width="140" height="140" rx="36" fill="url(#adriveGrad)" />
      <circle cx="70" cy="70" r="32" fill="none" stroke="#FFFFFF" stroke-width="12" />
      <text x="70" y="180" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#E2E8F0">阿里云盘</text>

      <!-- Calendar -->
      <rect x="220" y="0" width="140" height="140" rx="36" fill="#FFFFFF" />
      <text x="290" y="55" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#EF4444">TUE</text>
      <text x="290" y="115" text-anchor="middle" font-family="sans-serif" font-size="64" font-weight="900" fill="#000000">1</text>
      <text x="290" y="180" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#E2E8F0">Calendar</text>
    </g>

    <g transform="translate(70, 400)">
      <!-- Notes -->
      <rect x="0" y="0" width="140" height="140" rx="36" fill="url(#notesGrad)" />
      <line x1="25" y1="50" x2="115" y2="50" stroke="rgba(0,0,0,0.2)" stroke-width="6" />
      <line x1="25" y1="80" x2="90" y2="80" stroke="rgba(0,0,0,0.2)" stroke-width="6" />
      <text x="70" y="180" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#E2E8F0">Notes</text>

      <!-- Mail -->
      <rect x="220" y="0" width="140" height="140" rx="36" fill="url(#mailGrad)" />
      <text x="290" y="85" text-anchor="middle" font-family="sans-serif" font-size="44" fill="#FFFFFF">✉</text>
      <text x="290" y="180" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#E2E8F0">Mail</text>
    </g>
  </g>
  <defs>
    <linearGradient id="adriveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" /><stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="notesGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" /><stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <linearGradient id="mailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" /><stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>
</svg>